<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCS Brand Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   BOOK THEME. Neutral and identical for every product. Never brand it.
   Layout: fixed left navigation by part; one continuous 960px reading
   column; product styling lives only inside .p preview frames.
   ===================================================================== */
:root {
  --bk-bg: #ffffff; --bk-side: #fafafa; --bk-sunk: #f4f4f5; --bk-panel: #ffffff;
  --bk-border: #e4e4e7; --bk-border-2: #d4d4d8;
  --bk-text: #18181b; --bk-text-2: #52525b; --bk-text-3: #71717a;
  --bk-invert: #18181b; --bk-on-invert: #ffffff;
  --bk-ok: #15803d; --bk-ok-bg: #ecfdf3; --bk-no: #b91c1c; --bk-no-bg: #fef2f2; --bk-warn: #a16207; --bk-warn-bg: #fefce8; --bk-info: #1d4ed8; --bk-info-bg: #eff6ff;
  --bk-focus: #2563eb; --bk-code: #f4f4f5;
  --bk-font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bk-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --bk-r: 12px; --bk-r-sm: 8px; --bk-side-w: 264px; --bk-col: 960px; --bk-gut: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bk-bg: #0e0e10; --bk-side: #121215; --bk-sunk: #18181b; --bk-panel: #141417;
    --bk-border: #27272a; --bk-border-2: #3f3f46;
    --bk-text: #fafafa; --bk-text-2: #a1a1aa; --bk-text-3: #8b8b94;
    --bk-invert: #fafafa; --bk-on-invert: #18181b;
    --bk-ok: #4ade80; --bk-ok-bg: #0f2a1a; --bk-no: #f87171; --bk-no-bg: #2c1212; --bk-warn: #facc15; --bk-warn-bg: #2a2408; --bk-info: #93c5fd; --bk-info-bg: #0f1d33;
    --bk-focus: #60a5fa; --bk-code: #1d1d21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bk-bg: #0e0e10; --bk-side: #121215; --bk-sunk: #18181b; --bk-panel: #141417;
  --bk-border: #27272a; --bk-border-2: #3f3f46;
  --bk-text: #fafafa; --bk-text-2: #a1a1aa; --bk-text-3: #8b8b94;
  --bk-invert: #fafafa; --bk-on-invert: #18181b;
  --bk-ok: #4ade80; --bk-ok-bg: #0f2a1a; --bk-no: #f87171; --bk-no-bg: #2c1212; --bk-warn: #facc15; --bk-warn-bg: #2a2408; --bk-info: #93c5fd; --bk-info-bg: #0f1d33;
  --bk-focus: #60a5fa; --bk-code: #1d1d21;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body { background: var(--bk-bg); color: var(--bk-text); font-family: var(--bk-font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
a { color: inherit; }
h1, h2, h3, h4, p, ul, ol, dl, figure { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bk-focus); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--bk-mono); font-size: 12.5px; }
:not(pre) > code { padding: 1px 6px; border-radius: 5px; background: var(--bk-code); border: 1px solid var(--bk-border); white-space: nowrap; }
.logo { display: block; width: var(--lw, 140px); max-width: 100%; height: auto; object-fit: contain; }
.ico { width: 16px; height: 16px; flex: none; }
.sec, .comp, .demo, .stack, .hero, .ch-head, .rule, .dd, .who { grid-template-columns: minmax(0, 1fr); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Sidebar */
.side { position: fixed; inset: 0 auto 0 0; width: var(--bk-side-w); display: flex; flex-direction: column; background: var(--bk-side); border-right: 1px solid var(--bk-border); z-index: 30; padding-left: env(safe-area-inset-left, 0px); }
.side__head { display: flex; flex-direction: column; gap: 12px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px 20px; border-bottom: 1px solid var(--bk-border); }
.side__title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
.side__ver { font-family: var(--bk-mono); font-size: 11px; font-weight: 500; color: var(--bk-text-3); padding: 2px 6px; border: 1px solid var(--bk-border); border-radius: 6px; }
.side__nav { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-group__title { padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bk-text-3); }
.nav-link { display: block; padding: 6px 12px; border-radius: var(--bk-r-sm); font-size: 14px; font-weight: 500; color: var(--bk-text-2); text-decoration: none; }
.nav-link--sub { padding: 4px 12px 4px 24px; font-size: 13px; font-weight: 400; color: var(--bk-text-3); }
.nav-link:hover { background: var(--bk-sunk); color: var(--bk-text); }
.nav-link[aria-current] { background: var(--bk-panel); color: var(--bk-text); box-shadow: 0 0 0 1px var(--bk-border), 0 1px 2px rgba(0,0,0,.04); }
.side__foot { padding: 14px 24px calc(18px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--bk-border); display: grid; gap: 10px; }
.side__foot > div { display: grid; gap: 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 9px; background: var(--bk-sunk); border: 1px solid var(--bk-border); }
.seg button { border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--bk-text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bk-panel); color: var(--bk-text); box-shadow: 0 0 0 1px var(--bk-border), 0 1px 2px rgba(0,0,0,.06); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bk-text-3); }
.topbar { display: none; }

/* Page rhythm: chapter 72 / section 56 / block 20 / heading 6 */
.main { margin-left: var(--bk-side-w); min-height: 100vh; }
.wrap { max-width: calc(var(--bk-col) + 2 * var(--bk-gut)); margin: 0 auto; padding-left: max(var(--bk-gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--bk-gut), env(safe-area-inset-right, 0px)); }
.chapter { padding-block: 72px; }
.chapter + .chapter { border-top: 1px solid var(--bk-border); }
.part { background: var(--bk-sunk); border-top: 1px solid var(--bk-border); border-bottom: 1px solid var(--bk-border); }
.part .wrap { padding-block: 44px; display: grid; gap: 6px; }
.part__n { font-family: var(--bk-mono); font-size: 12px; color: var(--bk-text-3); text-transform: uppercase; letter-spacing: .06em; }
.part h2 { font-size: 40px; line-height: 1.1; font-weight: 650; letter-spacing: -.03em; }
.part p { font-size: 16px; color: var(--bk-text-2); }
.ch-head { display: grid; gap: 10px; padding-bottom: 28px; margin-bottom: 40px; border-bottom: 1px solid var(--bk-border); }
.ch-head h1 { font-size: 32px; line-height: 1.2; font-weight: 650; letter-spacing: -.025em; }
.ch-head p { font-size: 16.5px; line-height: 1.6; color: var(--bk-text-2); max-width: 68ch; }
.ch-src { display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-size: 12.5px; color: var(--bk-text-3); text-decoration: none; }
.ch-src:hover { color: var(--bk-text); }
.sec { display: grid; gap: 20px; scroll-margin-top: 24px; }
.sec + .sec { margin-top: 56px; }
.sec-head { display: grid; gap: 6px; max-width: 68ch; }
.sec-head h2 { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
.sec-head p { color: var(--bk-text-2); }
.sec-head--row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; max-width: none; }
.prose { display: grid; gap: 14px; max-width: 70ch; }
.prose p { color: var(--bk-text-2); }
.prose p:first-child { color: var(--bk-text); font-size: 16px; }
.muted { color: var(--bk-text-2); }
.small { font-size: 13px; color: var(--bk-text-3); }

/* Book components */
.card { background: var(--bk-panel); border: 1px solid var(--bk-border); border-radius: var(--bk-r); padding: 24px; min-width: 0; }
.card h3 { font-size: 15.5px; font-weight: 600; }
.card p { font-size: 14px; color: var(--bk-text-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 8px; align-content: start; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--bk-border); border-radius: var(--bk-r); background: var(--bk-panel); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; min-width: 560px; }
.tbl th { text-align: left; padding: 11px 16px; font-size: 12px; font-weight: 600; color: var(--bk-text-3); background: var(--bk-sunk); border-bottom: 1px solid var(--bk-border); white-space: nowrap; }
.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--bk-border); vertical-align: top; color: var(--bk-text-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-weight: 500; color: var(--bk-text); }
.tbl--fixed td:first-child { width: 30%; }
.tbl--wide { min-width: 900px; }
.tbl--wide td:nth-child(4) { min-width: 240px; }
.rule { display: grid; gap: 12px; align-content: start; }
.rule__tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.rule--do .rule__tag { color: var(--bk-ok); }
.rule--dont .rule__tag { color: var(--bk-no); }
.list { list-style: none; padding: 0; display: grid; gap: 8px; }
.list li { position: relative; padding-left: 18px; font-size: 14px; color: var(--bk-text-2); }
.list li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--bk-border-2); }
.rows { list-style: none; padding: 0; border-top: 1px solid var(--bk-border); }
.rows li { display: grid; grid-template-columns: 40px 220px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--bk-border); align-items: baseline; }
.rows b { font-size: 15px; font-weight: 600; }
.rows p { font-size: 14.5px; color: var(--bk-text-2); }
.num { font-family: var(--bk-mono); font-size: 12px; color: var(--bk-text-3); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: var(--bk-r-sm); border: 1px solid var(--bk-border); background: var(--bk-panel); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--bk-text); text-decoration: none; }
.btn:hover { border-color: var(--bk-border-2); background: var(--bk-sunk); }
.copy { all: unset; cursor: pointer; font-family: var(--bk-mono); font-size: 12px; color: var(--bk-text-2); border-radius: 4px; }
.copy:hover { color: var(--bk-text); text-decoration: underline; }
.copy:focus-visible { outline: 2px solid var(--bk-focus); outline-offset: 2px; }
pre.code { position: relative; margin: 0; padding: 16px 18px; border-radius: var(--bk-r); background: var(--bk-code); border: 1px solid var(--bk-border); overflow-x: auto; font-family: var(--bk-mono); font-size: 12.5px; line-height: 1.7; }
pre.code .btn { position: absolute; top: 8px; right: 8px; padding: 4px 10px; font-family: var(--bk-font); font-size: 12px; }
.badge { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge--ok { background: var(--bk-ok-bg); color: var(--bk-ok); }
.badge--no { background: var(--bk-no-bg); color: var(--bk-no); }
.badge--warn { background: var(--bk-warn-bg); color: var(--bk-warn); }
.badge--info { background: var(--bk-info-bg); color: var(--bk-info); }
.badge--muted { background: var(--bk-sunk); color: var(--bk-text-2); }
.frame { border: 1px solid var(--bk-border); border-radius: var(--bk-r); overflow: hidden; min-width: 0; }
.frame__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 9px 16px; background: var(--bk-sunk); border-bottom: 1px solid var(--bk-border); font-size: 12px; color: var(--bk-text-3); font-weight: 500; }
.frame__body { padding: 32px; }
.frame__body--center { display: grid; place-items: center; min-height: 220px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); padding: 9px 16px; border-radius: 999px; background: var(--bk-invert); color: var(--bk-on-invert); font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Home */
.hero { display: grid; gap: 20px; }
.hero h1 { font-size: 44px; line-height: 1.1; font-weight: 650; letter-spacing: -.03em; }
.hero > p { font-size: 17px; color: var(--bk-text-2); max-width: 64ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 40px; padding-top: 20px; border-top: 1px solid var(--bk-border); }
.meta div { display: grid; gap: 2px; }
.meta dd { margin: 0; font-size: 14px; font-weight: 500; }
.who { display: grid; gap: 14px; align-content: start; }
.who ul { list-style: none; padding: 0; display: grid; border-top: 1px solid var(--bk-border); }
.who a { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bk-border); font-size: 14px; color: var(--bk-text-2); text-decoration: none; }
.who a:hover { color: var(--bk-text); }

/* Logo */
.clear { width: min(100%, 400px); margin: 0 auto; }
.clear__box { position: relative; padding: 16.66%; outline: 1px dashed var(--brand-text); background-image: repeating-linear-gradient(45deg, transparent 0 7px, var(--brand-tint) 7px 8px); }
.clear__box .logo { background: var(--card); }
.clear__x { position: absolute; font: 600 11px/1 var(--bk-mono); color: var(--brand-text); transform: translate(-50%, -50%); }
.sizes { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 28px; }
.sizes figure { display: grid; gap: 10px; }
.sizes figcaption { font-size: 12px; color: var(--ink-muted); font-weight: 500; }
.bgs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.bgs figure { display: grid; gap: 10px; min-width: 0; }
.bgs__face { display: grid; place-items: center; aspect-ratio: 3 / 2; border-radius: var(--bk-r); border: 1px solid var(--bk-border); padding: 16px; }
.bgs figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.bgs figcaption .ico { color: var(--bk-ok); }
.never { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.never li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--bk-border); font-size: 14px; color: var(--bk-text-2); }
.never .ico { margin-top: 3px; color: var(--bk-no); }

/* Colour */
.core { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; }
.core__sw { display: flex; flex-direction: column; justify-content: space-between; gap: 32px; min-height: 200px; padding: 20px; border-radius: var(--bk-r); border: 1px solid var(--bk-border); }
.core__sw b { font-size: 18px; font-weight: 600; }
.core__sw dl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; }
.core__sw dt { opacity: .7; }
.core__sw dd { margin: 0; font-family: var(--bk-mono); }
.core__sw .copy { color: inherit; }
.tok-group { display: grid; gap: 10px; }
.tok-group + .tok-group { margin-top: 24px; }
.tok-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tok { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--bk-border); border-radius: var(--bk-r); background: var(--bk-panel); min-width: 0; }
.tok__chip { display: grid; grid-template-rows: 1fr 1fr; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(128,128,128,.28); }
.tok__body { display: grid; gap: 1px; min-width: 0; justify-items: start; }
.tok__name { font-family: var(--bk-mono); font-size: 12.5px; font-weight: 500; color: var(--bk-text); overflow-wrap: anywhere; }
.tok__ref { font-family: var(--bk-mono); font-size: 11px; color: var(--bk-text-3); overflow-wrap: anywhere; }
.tok__use { font-size: 12px; color: var(--bk-text-2); line-height: 1.4; }
.ramp { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 16px; align-items: center; }
.ramp + .ramp { margin-top: 12px; }
.ramp__name { font-size: 13px; font-weight: 600; }
.ramp__steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-radius: var(--bk-r-sm); overflow: hidden; border: 1px solid var(--bk-border); }
.step { all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; min-height: 60px; padding: 6px; font-family: var(--bk-mono); font-size: 10px; line-height: 1.3; }
.step:focus-visible { outline: 2px solid var(--bk-focus); outline-offset: -2px; }

/* Type */
.face { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; align-items: center; }
.face__aa { font-size: 88px; line-height: .9; letter-spacing: -.03em; color: var(--ink); }
.face__glyphs { font-size: 16px; line-height: 1.5; color: var(--ink-soft); overflow-wrap: anywhere; }
.scale__row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; align-items: baseline; padding: 16px 28px; border-bottom: 1px solid var(--line); }
.scale__row:last-child { border-bottom: 0; }
.scale__meta { display: grid; gap: 2px; font-family: var(--bk-mono); font-size: 11.5px; color: var(--ink-muted); }
.scale__meta b { font-size: 12.5px; color: var(--ink); font-weight: 500; }
.scale__sample { min-width: 0; overflow-wrap: anywhere; color: var(--ink); }

/* Spacing, radius, elevation */
.space-row { display: grid; grid-template-columns: 90px 56px minmax(0, 1fr); gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bk-border); }
.space-row:last-child { border-bottom: 0; }
.space-row i { display: block; height: 12px; border-radius: 3px; background: var(--bk-invert); opacity: .8; max-width: 100%; }
.gridviz { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; height: 132px; }
.gridviz i { background: var(--brand-tint); border-radius: 4px; }
.gridviz__spans { position: absolute; inset: auto 0 16px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; }
.gridviz__spans div { height: 44px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.radii { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 16px; }
.rad { display: grid; gap: 8px; }
.rad__shape { aspect-ratio: 1; background: var(--card); border: 1.5px solid var(--brand-text); }
.rad b { font-family: var(--bk-mono); font-size: 12px; font-weight: 500; color: var(--ink); }
.rad span { font-size: 12px; color: var(--ink-muted); }
.shadows { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 28px; }
.shd { display: grid; gap: 10px; }
.shd__box { height: 92px; border-radius: var(--radius-xl); background: var(--card); }
.shd b { font-family: var(--bk-mono); font-size: 12px; font-weight: 500; color: var(--ink); }
.shd span { font-size: 12px; color: var(--ink-muted); }
.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 16px 20px; border-radius: var(--bk-r); background: var(--bk-info-bg); color: var(--bk-text); font-size: 14px; }
.callout .ico { margin-top: 3px; color: var(--bk-info); }

/* Icons */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.icon { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 10px; padding: 20px 6px; color: var(--ink); box-shadow: inset -1px -1px 0 var(--line); transition: background-color .15s; }
.icon:hover { background: var(--sand); }
.icon:focus-visible { outline: 2px solid var(--bk-focus); outline-offset: -2px; }
.icon svg { width: 24px; height: 24px; }
.icon span { font-family: var(--bk-mono); font-size: 10.5px; color: var(--ink-muted); }

/* Motion */
.curve { display: grid; gap: 12px; align-content: start; }
.curve svg { width: 100%; max-width: 180px; height: auto; }
.plot-grid { stroke: var(--bk-border); fill: none; }
.plot-line { stroke: var(--bk-text); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.plot-handle { stroke: var(--bk-text-3); stroke-dasharray: 3 3; fill: none; }
.plot-pt { fill: var(--bk-panel); stroke: var(--bk-text-3); stroke-width: 1.5; }
.track { position: relative; height: 32px; border-radius: 999px; background: var(--bk-sunk); border: 1px solid var(--bk-border); }
.track i { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--bk-invert); transition: transform 1.2s var(--e, linear); }
.track.on i { transform: translateX(calc(var(--w, 200px) - 32px)); }
.dur { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; align-items: center; padding: 5px 0; }
.dur b { font-family: var(--bk-mono); font-size: 12px; font-weight: 500; text-align: right; }
.dur__bar { height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; background: var(--bk-sunk); border: 1px solid var(--bk-border); font-size: 12.5px; color: var(--bk-text-2); white-space: nowrap; overflow: hidden; }

/* Component doc block */
.comp { display: grid; gap: 20px; scroll-margin-top: 24px; }
.comp + .comp { margin-top: 64px; padding-top: 64px; border-top: 1px solid var(--bk-border); }
.comp-head { display: grid; gap: 6px; }
.comp-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
.comp-head p { color: var(--bk-text-2); max-width: 68ch; }
.comp-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.spec { display: grid; padding: 4px 20px; }
.spec div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bk-border); font-size: 13.5px; }
.spec div:last-child { border-bottom: 0; }
.spec dt { color: var(--bk-text-3); }
.spec dd { margin: 0; color: var(--bk-text); min-width: 0; }
.dd { display: grid; gap: 16px; }
.dd .card { padding: 18px 20px; }
.dd p { font-size: 14px; color: var(--bk-text); }
.demo { display: grid; gap: 24px; }
.demo__row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.demo__label { font-family: var(--bk-mono); font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .04em; }
.states { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 16px; }
.states figure { display: grid; gap: 8px; justify-items: start; }
.states figcaption { font-size: 12px; color: var(--ink-muted); }
.sec + .comp { margin-top: 64px; padding-top: 64px; border-top: 1px solid var(--bk-border); }
.tbl--log td:nth-child(1) { width: 24%; } .tbl--log td:nth-child(2) { width: 10%; } .tbl--log td:nth-child(3) { width: 14%; }
.vis { padding: 14px; border-radius: 10px; margin: 2px 0 6px; border: 1px solid var(--bk-border); }
.tbl--voice { min-width: 900px; }
.tbl--voice td { min-width: 110px; }
.icon-tools { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.icon-filter { height: 30px; width: 180px; max-width: 100%; padding: 0 10px; border: 1px solid var(--bk-border); border-radius: 8px; background: var(--bk-panel); color: var(--bk-text); font: inherit; font-size: 13px; }
.icon span { overflow-wrap: anywhere; text-align: center; }
.lib-sum { display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 16px 20px; border: 1px solid var(--bk-border); border-radius: var(--bk-r); background: var(--bk-sunk); }
.lib-sum div { display: grid; gap: 2px; }
.lib-sum b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tbl a { color: var(--bk-text); text-decoration: none; }
.tbl a:hover { text-decoration: underline; }
.comp-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.comp-meta { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ver { font-family: var(--bk-mono); font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--bk-border); color: var(--bk-text-2); background: var(--bk-panel); }
.clog { border: 1px solid var(--bk-border); border-radius: var(--bk-r); background: var(--bk-panel); }
.clog summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.clog summary::-webkit-details-marker { display: none; }
.clog summary .ico { transition: transform .2s; color: var(--bk-text-3); }
.clog[open] summary .ico { transform: rotate(180deg); }
.clog ol { list-style: none; margin: 0; padding: 0 20px 8px; }
.clog li { display: grid; grid-template-columns: 72px 104px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--bk-border); font-size: 13.5px; color: var(--bk-text-2); }
.clog li b { font-family: var(--bk-mono); font-size: 12px; font-weight: 500; color: var(--bk-text); }
@media (max-width: 640px) { .clog li { grid-template-columns: 64px minmax(0, 1fr); } .clog li span:last-child { grid-column: 1 / -1; } }

/* =====================================================================
   PRODUCT COMPONENTS. Read only product tokens, so they work for any
   product. tools/build.js copies the block below to tokens/components.css.
   ===================================================================== */
/* =====================================================================
   QCS BOOK ACCENT. The book frame carries the QCS primary teal in
   active, selected and signpost areas. Lighter teal in the dark book.
   ===================================================================== */
:root { --bk-accent: #0F3D3C; --bk-accent-hover: #155150; --bk-accent-text: #0F3D3C; --bk-accent-tint: #E4EFED; --bk-on-accent: #FFFFFF; --bk-focus: #0F3D3C; --bk-hero: #0F3D3C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bk-accent: #326668; --bk-accent-hover: #3B7577; --bk-accent-text: #8CC2BA; --bk-accent-tint: rgba(50,102,104,.28); --bk-focus: #8CC2BA; --bk-hero: #123F3E; }
}
:root[data-theme="dark"] { --bk-accent: #326668; --bk-accent-hover: #3B7577; --bk-accent-text: #8CC2BA; --bk-accent-tint: rgba(50,102,104,.28); --bk-focus: #8CC2BA; --bk-hero: #123F3E; }

/* Sidebar */
.side__head { border-top: 4px solid var(--bk-accent); }
.side__ver { color: var(--bk-accent-text); background: var(--bk-accent-tint); border-color: transparent; font-weight: 600; }
.nav-group__title { color: var(--bk-accent-text); }
.nav-link:hover { background: var(--bk-accent-tint); color: var(--bk-accent-text); }
.nav-link[aria-current] { background: var(--bk-accent); color: var(--bk-on-accent); box-shadow: none; font-weight: 600; }
.nav-link--sub[aria-current] { background: var(--bk-accent-tint); color: var(--bk-accent-text); }
.seg button[aria-pressed="true"] { background: var(--bk-accent); color: var(--bk-on-accent); box-shadow: none; font-weight: 600; }

/* Home hero */
.hero { background: var(--bk-hero); color: #FFFFFF; border-radius: 20px; padding: 48px; }
.hero h1 { color: #FFFFFF; }
.hero > p { color: rgba(255,255,255,.86); }
.hero .meta { border-top-color: rgba(255,255,255,.22); }
.hero .meta .label { color: rgba(255,255,255,.7); }
.hero .meta dd { color: #FFFFFF; }
.who h3 { color: var(--bk-accent-text); }
.who a:hover { color: var(--bk-accent-text); }
.who a .ico { color: var(--bk-accent-text); }

/* Part banners and chapter heads */
.part { background: var(--bk-hero); border-color: var(--bk-hero); }
.part h2 { color: #FFFFFF; }
.part p { color: rgba(255,255,255,.82); }
.part__n { color: #8CC2BA; font-weight: 600; }
.ch-head { border-bottom: 1px solid var(--bk-border); box-shadow: inset 0 -3px 0 -1px transparent; position: relative; }
.ch-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 72px; height: 3px; border-radius: 3px; background: var(--bk-accent); }
.ch-src:hover { color: var(--bk-accent-text); }

/* Links, buttons and small accents */
.tbl a { color: var(--bk-accent-text); font-weight: 600; }
.copy:hover { color: var(--bk-accent-text); }
.btn:hover { border-color: var(--bk-accent); color: var(--bk-accent-text); background: var(--bk-accent-tint); }
.callout { background: var(--bk-accent-tint); }
.callout .ico { color: var(--bk-accent-text); }
.toast { background: var(--bk-accent); color: var(--bk-on-accent); }
.space-row i, .track i { background: var(--bk-accent); opacity: 1; }
.icon:hover { color: var(--bk-accent-text); }
::selection { background: #E4EFED; color: #0F3D3C; }
@media (max-width: 720px) { .hero { padding: 28px 20px; } }

/* Sidebar accordion */
.side__nav { gap: 4px; padding: 14px 12px 20px; }
.nav-link { display: flex; align-items: center; gap: 10px; }
.nav-acc__icon { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--bk-accent-tint); color: var(--bk-accent-text); transition: background .16s, color .16s; }
.nav-link--home { padding: 8px 10px; font-size: 14px; font-weight: 700; color: var(--bk-text); margin-bottom: 6px; }
.nav-link--home[aria-current] .nav-acc__icon { background: rgba(255,255,255,.16); color: #FFFFFF; }
.nav-acc { border-radius: 10px; }
.nav-acc__head { list-style: none; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--bk-text); user-select: none; }
.nav-acc__head::-webkit-details-marker, .nav-sub > summary::-webkit-details-marker { display: none; }
.nav-acc__head:hover { background: var(--bk-accent-tint); }
.nav-acc[open] > .nav-acc__head .nav-acc__icon { background: var(--bk-accent); color: var(--bk-on-accent); }
.nav-acc__title { flex: 1; min-width: 0; display: grid; font-size: 14px; font-weight: 700; line-height: 1.25; }
.nav-acc__title small { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bk-text-3); }
.nav-acc__count { flex: none; font-family: var(--bk-mono); font-size: 11px; color: var(--bk-text-3); padding: 1px 7px; border-radius: 999px; background: var(--bk-sunk); border: 1px solid var(--bk-border); }
.nav-chev { flex: none; color: var(--bk-text-3); transition: transform .2s; }
.nav-acc[open] > .nav-acc__head .nav-chev, .nav-sub[open] > summary .nav-chev { transform: rotate(180deg); }
.nav-acc__body { display: flex; flex-direction: column; gap: 1px; margin: 4px 0 8px 23px; padding-left: 10px; border-left: 1px solid var(--bk-border); }
.nav-link__n { flex: none; min-width: 18px; font-family: var(--bk-mono); font-size: 11px; color: var(--bk-text-3); }
.nav-link[aria-current] .nav-link__n { color: rgba(255,255,255,.7); }
.nav-sub > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--bk-text-2); user-select: none; }
.nav-sub > summary:hover { background: var(--bk-accent-tint); color: var(--bk-accent-text); }
.nav-sub__title { flex: 1; }
.nav-sub[open] > summary { color: var(--bk-accent-text); }
.nav-sub__body { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 12px; padding-left: 8px; border-left: 1px solid var(--bk-border); }
.nav-link--sub { padding: 5px 10px; font-size: 13px; }

/* Wider reading area */
:root { --bk-col: 1240px; }
.prose { max-width: 92ch; }
.ch-head p { max-width: 92ch; }
body.paged .chapter { padding-top: 28px; }

/* Sticky chapter header: soft teal panel that compacts on scroll */
:root { --bk-head-bg: rgba(228,239,237,.72); --bk-head-line: rgba(15,61,60,.10); --bk-head-shadow: 0 8px 24px -12px rgba(15,61,60,.22); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bk-head-bg: rgba(38,78,80,.55); --bk-head-line: rgba(140,194,186,.16); --bk-head-shadow: 0 8px 24px -12px rgba(0,0,0,.6); } }
:root[data-theme="dark"] { --bk-head-bg: rgba(38,78,80,.55); --bk-head-line: rgba(140,194,186,.16); --bk-head-shadow: 0 8px 24px -12px rgba(0,0,0,.6); }
.ch-head { position: sticky; top: 16px; z-index: 20; gap: 8px; margin-bottom: 40px; padding: 26px 32px 24px 36px; border: 1px solid var(--bk-head-line); border-radius: 16px; background: var(--bk-head-bg); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); transition: padding .2s ease, box-shadow .2s ease; }
.ch-head::after { left: 0; top: 22px; bottom: 22px; width: 4px; height: auto; border-radius: 0 4px 4px 0; transition: top .2s ease, bottom .2s ease; }
.ch-head h1 { transition: font-size .2s ease; }
body.head-stuck .ch-head { padding: 12px 24px 12px 28px; box-shadow: var(--bk-head-shadow); }
body.head-stuck .ch-head::after { top: 12px; bottom: 12px; }
body.head-stuck .ch-head::before { content: ""; position: absolute; left: -2px; right: -2px; top: -18px; height: 17px; background: var(--bk-bg); pointer-events: none; }
body.head-stuck .ch-head h1 { font-size: 20px; line-height: 1.3; }
body.head-stuck .ch-head > p, body.head-stuck .ch-head > .ch-src { display: none; }
body.head-stuck .ch-head .ch-eyebrow { font-size: 11px; }
@media (max-width: 960px) { .ch-head { top: 72px; padding: 20px 20px 18px 24px; } }

/* One page at a time */
body.paged .part { display: none; }
.chapter[hidden] { display: none !important; }
.ch-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bk-accent-text); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--bk-border); }
.pager__link { display: grid; gap: 4px; padding: 16px 20px; border-radius: var(--bk-r); border: 1px solid var(--bk-border); background: var(--bk-panel); text-decoration: none; color: var(--bk-text); transition: border-color .16s, background .16s; }
.pager__link:hover { border-color: var(--bk-accent); background: var(--bk-accent-tint); }
.pager__link small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--bk-text-3); }
.pager__link b { font-size: 16px; color: var(--bk-accent-text); }
.pager__link--next { text-align: right; justify-items: end; }
@media (max-width: 640px) { .pager { grid-template-columns: 1fr; } }

/* ds:start */
.p { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
.ds-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--h-btn); border: 1px solid transparent; border-radius: var(--r-btn); padding: 0 24px; font-family: var(--font-body); font-size: var(--fs-btn); line-height: 1; font-weight: var(--fw-btn); white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color .3s var(--glide), color .3s var(--glide), border-color .3s var(--glide), transform .15s var(--glide); }
.ds-btn svg { width: 16px; height: 16px; flex: none; }
.ds-btn:active { transform: scale(.98); }
.ds-btn:focus-visible, .ds-btn.is-focus { outline: 2px solid var(--focus); outline-offset: 3px; }
.ds-btn--primary { background: var(--brand); color: var(--on-brand); }
.ds-btn--primary:hover, .ds-btn--primary.is-hover { background: var(--brand-deep); }
.ds-btn--secondary { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.ds-btn--secondary:hover { border-color: var(--ink); }
.ds-btn--ghost { background: transparent; color: var(--ink); padding: 0 8px; }
.ds-btn--ghost:hover { color: var(--brand-text); }
.ds-btn--danger { background: var(--danger-solid, var(--danger)); color: var(--on-danger); }
.ds-btn--danger:hover { filter: brightness(.92); }
.ds-btn--lg { min-height: var(--h-btn-lg); padding: 0 32px; font-size: var(--fs-btn-lg); font-weight: var(--fw-btn-lg); }
.ds-btn--icon { width: var(--h-btn); padding: 0; background: transparent; color: var(--ink); border-color: var(--line-strong); }
.ds-btn--sm { min-height: var(--h-btn-sm); padding: 0 16px; font-size: 14px; }
.ds-btn.is-press { transform: scale(.98); background: var(--brand-deep); }
.ds-btn:disabled, .ds-btn.is-disabled { background: var(--sand); color: var(--ink-muted); border-color: transparent; cursor: not-allowed; filter: none; }
.ds-btn.is-loading { pointer-events: none; }
.ds-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ds-spin .8s linear infinite; }
@keyframes ds-spin { to { transform: rotate(360deg); } }
.ds-field { display: grid; gap: 8px; min-width: 0; align-content: start; }
.ds-field__label { font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--ink-soft); }
.ds-field__input { width: 100%; min-height: var(--h-input); background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-input); padding: 0 14px; font-family: var(--font-body); font-size: 16px; color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
.ds-field__input::placeholder { color: var(--ink-muted); }
.ds-field__input:focus, .ds-field__input.is-focus { border-color: var(--brand); box-shadow: var(--shadow-halo); }
.ds-field__input:disabled { background: var(--sand); color: var(--ink-muted); border-color: var(--line); cursor: not-allowed; }
.ds-field__input[readonly] { background: var(--paper-deep); border-style: dashed; }
.ds-field__help { font-size: 12.5px; line-height: 1.4; color: var(--ink-muted); }
.ds-field--error .ds-field__input { border-color: var(--danger-line, var(--danger)); }
.ds-field--error .ds-field__help { color: var(--danger-line, var(--danger)); }
.ds-field--success .ds-field__input { border-color: var(--success); }
.ds-field--success .ds-field__help { color: var(--success); }
.ds-search { position: relative; display: block; }
.ds-search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-muted); }
.ds-search .ds-field__input { padding-left: 42px; border-radius: var(--r-search); }
.ds-check { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.ds-check input { appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border: 1.5px solid var(--line-strong); border-radius: 6px; background: var(--card); display: grid; place-content: center; cursor: pointer; transition: background-color .2s, border-color .2s; }
.ds-check input:checked { background: var(--brand); border-color: var(--brand); }
.ds-check input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-brand); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.ds-check input[type="radio"] { border-radius: 50%; }
.ds-check input[type="radio"]:checked { background: var(--card); }
.ds-check input[type="radio"]:checked::after { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--brand); transform: none; }
.ds-check input:disabled { background: var(--sand); border-color: var(--line); cursor: not-allowed; }
.ds-check:has(input:disabled) { color: var(--ink-muted); cursor: not-allowed; }
.ds-check input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ds-switch input { width: 40px; height: 24px; border: 0; border-radius: 999px; background: var(--line-strong); position: relative; display: block; }
.ds-switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); transition: transform .25s var(--glide); }
.ds-switch input:checked { background: var(--brand); }
.ds-switch input:checked::after { width: 18px; height: 18px; border: 0; transform: translateX(16px); background: var(--card); }
.ds-switch input:disabled { background: var(--line); }
.ds-card { display: grid; gap: 10px; align-content: start; background: var(--card); border-radius: var(--r-card); box-shadow: 0 0 0 1px var(--ring), var(--shadow-rest); padding: 24px; color: var(--ink); text-decoration: none; transition: transform .4s var(--glide), box-shadow .4s var(--glide); min-width: 0; }
.ds-card--link:hover, .ds-card--link.is-hover { transform: translateY(var(--card-lift)); box-shadow: 0 0 0 1px var(--ring), var(--shadow-lift); }
.ds-card__eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.ds-card__title { font-family: var(--font-display); font-size: 20px; line-height: 1.25; font-weight: 600; }
.ds-card__text { font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); }
.ds-tag { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-tag); padding: 4px 11px; font-size: 12px; line-height: 1.4; font-weight: 600; background: var(--sand); color: var(--ink-soft); white-space: nowrap; }
.ds-tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ds-tag--brand { background: var(--brand-tint); color: var(--brand-tint-text); }
.ds-tag--success { background: var(--success-tint); color: var(--success); }
.ds-tag--warning { background: var(--warning-tint); color: var(--warning); }
.ds-tag--danger { background: var(--danger-tint); color: var(--danger); }
.ds-tag--info { background: var(--info-tint); color: var(--info); }
.ds-alert { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; align-items: start; border-radius: var(--radius-md); padding: 14px 16px; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.ds-alert svg { width: 20px; height: 20px; margin-top: 1px; }

  /* QCS patterns (replace the standard list; previews reuse the standard ones where they fit). */
  patterns: [
    { id: "list", name: "List pages", rules: ["Order: title and count, then search and filters, then the table, then pagination.", "One primary action on the right of the title row, 48 px.", "Search on the left; filters beside it; keep applied filters visible.", "Bulk actions appear in a selection bar only when rows are selected.", "Status is a dot and a word in its own column. Professionals, Service users, PAL audit and Manage organisations all follow this."] },
    { id: "forms", name: "Forms in modals", preview: "forms", rules: ["Forms live in the 520 px modal. QCS has no drawer or side panel.", "Labels above fields, always visible; 48 px fields.", "Mark optional fields, not required ones.", "Validate on blur; keep the person’s input when there is an error.", "Cancel on the left of the action in the footer; Escape closes unless saving."] },
    { id: "steps", name: "Multi-step flows", preview: "steps", rules: ["The PAL audit flow is Start, nine questions, review, result.", "Show where the person is and what is done; keys 1 to 4, Enter and arrows work in the checklist.", "Back steps back one question without losing answers.", "End with the finding in one sentence, then the detail."] },
    { id: "states", name: "Empty, loading & error", preview: "states", wide: true, rules: ["Loading: name what is loading; keep the layout still.", "Unread values show “—”, never 0.", "Empty: say what is missing and give one action to start.", "No results: say what was searched and offer to clear filters.", "Error: say what went wrong in plain words and offer Try again.", "Disabled: say why in a tooltip on the control."] },
    { id: "feedback", name: "Feedback", rules: ["Snackbar: confirm an action that just finished. It closes by itself.", "Callout: keep a message next to the content it is about until it is resolved.", "Modal: ask for a decision before something hard to undo.", "Show one message at a time.", "Use success tokens for success and danger tokens only for failed or spent."] },
    { id: "data", name: "Tables & data views", rules: ["Plain header row, striped flat rows, status as a dot and a word.", "Row actions are links on the right: Manage, Review.", "Paginate and say how many rows exist: “1–10 of 48”.", "The table scrolls inside its frame; the page never scrolls sideways.", "Show “Previous manager: X” only when the manager is archived."] },
    { id: "dashboard", name: "Dashboard", rules: ["Named sections: Overview, Adoption snapshot, Pending actions.", "Each card has an icon circle and a title, then numbers split by hairlines.", "Sections stack below 1180 px; a card’s inside never changes."] },
    { id: "audit", name: "Full-screen audit", rules: ["Opens over the whole app with a top bar and Back on the left.", "A sticky 300 px sidebar holds files and actions; one column holds the report.", "Long reports group areas into accordions, with the group that needs action first.", "The result states the finding in one sentence before the detail."] },
    { id: "allowance", name: "Allowances", rules: ["Spell out the count: “8 of 10 used this month”.", "Teal while healthy, amber when running low, red when spent.", "When spent, block the action and say why: “No care plan audits left this month. You have used all 10.”", "Offer the way forward: Request increase."] },
    { id: "nav", name: "Navigation", rules: ["Flat teal sidebar; the active item is a square block.", "The QCS menu shows only Dashboard, Professionals, Service users, PAL audit and Settings.", "Page actions sit in the page, never in the header.", "Back returns to the list the person came from; Back to QCS leaves the organisation."] }
  ],

  usage: [
    ["Buttons", "Use one primary per page and action teal only for audits and shortcuts.", "Show several competing primaries in one area."],
    ["Colour", "Use semantic tokens: teal for action, amber for inactive, red only for failed or spent.", "Use raw hex values, legacy colours, or colour alone to show status."],
    ["Typography", "Use Lato and the approved scale; 12 px is the floor.", "Add a second typeface or one-off sizes and weights."],
    ["Radius", "Use 8, 12, 20 or pill.", "Invent a new radius."],
    ["Controls", "Use 38 px actions, 42 px list search and 48 px form fields and main add button.", "Mix control heights in one row."],
    ["Forms", "Show labels, validation and helpful error messages, inside the 520 px modal.", "Rely on placeholder text, or use a drawer."],
    ["Cards & surfaces", "White cards, 20 px radius, 20 px padding, shadow-card, hairline dividers.", "Darker fills to fake depth, borders on cards, or cards in cards."],
    ["Shadow", "Use shadow-card, shadow-navigation or shadow-overlay; keep table rows flat.", "Invent a heavier shadow."],
    ["Spacing & layout", "Use the base-4 scale; work from 1180 px up; stack below 1180 px.", "Add one-off gaps or let the page scroll sideways."],
    ["Icons", "Use line icons at 1.8 px with a label; 16, 21 or 23 px.", "Use filled icons, text glyphs or mixed colours in one component."],
    ["Status", "Use a dot or pill plus a word; archived is amber; unread is “—”.", "Use a bare dot, red for archived, or 0 for an unread value."],
    ["Tables & data", "Keep headers, status and row actions in the same place.", "Add shadows to rows or hide status."],
    ["Navigation", "Keep the flat teal sidebar with a square active block.", "Use a rounded pill for the active item."],
    ["Overlays", "Use the modal or the tooltip.", "Use a drawer or side panel."],
    ["Feedback", "Confirm results and say how to recover from errors.", "Show success in teal, or an error with no way forward."],
    ["Content", "Use product words from the word list in British English.", "Use code words such as bot or patient."],
    ["Something missing?", "Add it to the design system first, then use it.", "Design a one-off for a single screen."]
  ],
  keepInMind: ["Text stays readable on its background: aim for 4.5:1, and use the approved pairs in the colour chapter.", "Amber (3.71:1) and muted text (3.54:1) never carry information on their own; pair them with a word.", "Every interactive element shows the 2 px teal focus outline, offset 2 px. Never set outline: none without an equal replacement.", "Fields keep a visible label; errors are written in words next to the field.", "Status, selection and validation never rely on colour alone.", "Icon-only controls have an accessible name; disabled controls say why.", "Modals trap focus, close on Escape and return focus to the trigger.", "Check every screen at 1280, 1440, 1600, 1920 and 2560 px, with no sideways scroll."],
  tokenNaming: [
    ["Primitive", "<scale>-<step>", "teal-900", "Use primitives directly in components"],
    ["Surface", "<role>", "card", "Hard-code white or black"],
    ["Text", "ink, ink-<level>", "ink-soft", "Use text tokens as backgrounds"],
    ["Brand", "brand, brand-<variant>", "brand-tint", "Name a token after its colour"],
    ["Status", "<status>, <status>-tint", "warning-tint", "Use status colours for decoration"],
    ["Spacing", "space-<size>", "space-md", "Use one-off pixel values"],
    ["Radius", "radius-<size>", "radius-lg", "Mix radius sizes inside one component"],
    ["Shadow", "shadow-<purpose>", "shadow-card", "Invent a heavier shadow"],
    ["App token", "--careco-<role>", "--careco-primary-light", "Read QCS_PALETTE directly in a component"]

  /* ---------- Assemble ---------- */
  var who = [["Everyone", "Start with the brand.", [1]], ["Designers", "Build with foundations, components and patterns.", [2, 3, 4]], ["Developers", "Install tokens and record changes.", [5]]];
  var main = '<section class="chapter" id="home"><div class="wrap"><div class="hero">' + logoH(50) + '<h1>Brand Book</h1><p>' + esc(B.purpose) + '</p><dl class="meta"><div><dt class="label">Version</dt><dd>' + esc(B.version) + '</dd></div><div><dt class="label">Updated</dt><dd>' + esc(B.updated) + '</dd></div><div><dt class="label">Owner</dt><dd>' + esc(B.owner) + '</dd></div></dl></div>' +
    '<div class="grid-3" style="margin-top:48px">' + who.map(function (w) {

  var nav = '<a class="nav-link nav-link--home" href="#home">' + chip("house") + '<span>Home</span></a>', chNo = 0, ORDER = ["home"], NUM = {}, PARTOF = {};

        var cats = []; G.components.forEach(function (k) { if (cats.indexOf(k.cat) < 0) cats.push(k.cat); });
        cats.forEach(function (cat) {
          var items = G.components.filter(function (k) { return k.cat === cat; });
          nav += '<details class="nav-sub" data-cat="' + esc(cat) + '"><summary><span class="nav-sub__title">' + esc(cat) + '</span><span class="nav-acc__count">' + items.length + '</span>' + chev + '</summary><div class="nav-sub__body">' +
            items.map(function (k) { return '<a class="nav-link nav-link--sub" href="#c-' + k.id + '">' + k.name + '</a>'; }).join("") + '</div></details>';
        });
      }
    });
    nav += '</div></details>';
  });
  document.getElementById("main").innerHTML = main;
  document.getElementById("pvA").textContent = TH.a.name; document.getElementById("pvB").textContent = TH.b.name;
  document.querySelectorAll("[data-indeterminate]").forEach(function (el) { el.indeterminate = true; });
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("sideHead").innerHTML = '<a href="#home" aria-label="Brand book home">' + logoH(30) + '</a><div class="side__title"><span>Brand Book</span><span class="side__ver">v' + esc(B.version) + '</span></div>';
  document.getElementById("topBrand").innerHTML = logoH(24) + '<span>Brand Book</span>';

  /* ---------- Behaviour ---------- */
  var side = document.getElementById("side"), menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", function () { var o = side.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(o)); });
  side.addEventListener("click", function (e) { if (e.target.closest("a")) { side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); } });

  /* ---------- One page at a time ---------- */
  var title = function (c) { return c === "home" ? "Home" : TITLES[c]; };
  ORDER.forEach(function (c, i) {
    var sec = document.getElementById(c), wrap = sec && sec.querySelector(".wrap"); if (!wrap) return;
    var prev = ORDER[i - 1], next = ORDER[i + 1];
    wrap.insertAdjacentHTML("beforeend", '<nav class="pager" aria-label="Chapters">' +
      (prev ? '<a class="pager__link" href="#' + prev + '"><small>' + svgOf("arrow-left", 14) + 'Previous' + (NUM[prev] ? ' · ' + NUM[prev] : '') + '</small><b>' + title(prev) + '</b></a>' : '<span></span>') +
      (next ? '<a class="pager__link pager__link--next" href="#' + next + '"><small>Next' + (NUM[next] ? ' · ' + NUM[next] : '') + svgOf("arrow-right", 14) + '</small><b>' + title(next) + '</b></a>' : '<span></span>') + '</nav>');
  });
  document.body.classList.add("paged");

  var links = {}; document.querySelectorAll(".nav-link").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  var navEl = document.getElementById("nav");
  function reveal(a) {

  function mark(chapter, sub) {

  }
  var current = "", quietUntil = 0;

    if (el) { if (el.classList.contains("chapter")) ch = id; else if (el.classList.contains("part")) { var P = PARTS.filter(function (p) { return p.id === id; })[0]; ch = P ? P.chapters[0] : "home"; el = null; } else ch = (el.closest(".chapter") || { id: "home" }).id; }

  var comps = [].slice.call(document.querySelectorAll(".comp")), ticking = false;
  function spyComps() {
    ticking = false;

    var line = window.innerHeight * 0.3, hit = null;
    comps.forEach(function (c) { if (c.getBoundingClientRect().top <= line) hit = c; });

  function setTheme(t) { if (t) root.setAttribute("data-theme", t); else root.removeAttribute("data-theme"); tb.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === t)); }); try { localStorage.setItem("bb-theme", t); } catch (e) {} }

    var fail = function () { try { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} show("Press Ctrl+C to copy"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { show("Copied " + label); }, fail); else fail();
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy],[data-copy-from],[data-icon],#copyAllIcons"); if (!b) return;
    if (b.id === "copyAllIcons") { var sprite = '<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n' + Object.keys(ICONS).sort().map(function (n) { return '  <symbol id="icon-' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (B.iconStroke || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</symbol>'; }).join("\n") + '\n</svg>'; return copy(sprite, "icon sprite", b); }
    if (b.hasAttribute("data-icon")) { var n = b.getAttribute("data-icon"); return copy(svgOf(n), n + " SVG", b); }
    if (b.hasAttribute("data-copy-from")) { var el = document.getElementById(b.getAttribute("data-copy-from")); return copy(el.textContent.replace(/^Copy/, ""), "code", el); }

  });
})();
